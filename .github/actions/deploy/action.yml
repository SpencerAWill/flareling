# Deploys one environment (a Pulumi stack and its three Workers) at the
# checked-out commit. Used by cicd.yml's `deploy: dev` and `deploy: prod`
# jobs, which run with that GitHub environment and pass its secrets in as
# inputs: ucmc.spencerwill.com's pattern. (A reusable workflow didn't work
# here: environment secrets never reached it.)
#
# Order:
#   1. pulumi up            long-lived resources (D1, Queues, the domain)
#   2. sync-env             point the wrangler configs at this stack
#   3. build                with this stack's config
#   4. D1 restore point     the way back, since migrations have no "down"
#   5. migrate              before any code that needs the new schema
#   6. deploy jobs, realtime, then web   consumers, and the Durable
#                           Object class, before web, which binds to both
#   7. smoke                the @smoke Playwright specs against the site
#   8. rollback (prod)      the Workers' code, if smoke failed; never D1
name: Deploy
description: Deploys one environment's infrastructure and Workers.

inputs:
  environment:
    description: dev or prod (the Pulumi stack)
    required: true
  cloudflare-account-id:
    required: true
  pulumi-organization:
    description: The Pulumi org the OIDC exchange targets (vars.PULUMI_ORGANIZATION)
    required: true
  pulumi-user-login:
    description: The Pulumi user its token is for (vars.PULUMI_USER_LOGIN)
    required: true
  cloudflare-api-token:
    description: Wrangler's deploy token (the environment's CLOUDFLARE_API_TOKEN)
    required: true
  cloudflare-infra-api-token:
    description: pulumi up's token (the environment's CLOUDFLARE_INFRA_API_TOKEN)
    required: true
  stripe-secret-key:
    description: Optional; unset leaves billing off.
    default: ""
  stripe-webhook-secret:
    default: ""

outputs:
  url:
    description: The environment's web URL.
    value: ${{ steps.stack.outputs.url }}

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .nvmrc
        cache: pnpm

    - run: pnpm install --frozen-lockfile
      shell: bash

    # Exchanges the job's GitHub OIDC token for a short-lived Pulumi token and
    # exports it as PULUMI_ACCESS_TOKEN for the steps below; no Pulumi token
    # is stored. Needs `id-token: write` on the job. Pulumi Cloud trusts only
    # the environments listed for this repo in the account's issuer (managed
    # by SpencerAWill/spencerwill.com's infra/github): dev and prod here.
    # An hour outlasts the job's 30-minute timeout.
    - uses: pulumi/auth-actions@141415910c3beb54e03b48e9057c204c97b956f2 # v2.1.0
      with:
        organization: ${{ inputs.pulumi-organization }}
        requested-token-type: urn:pulumi:token-type:access_token:personal
        scope: user:${{ inputs.pulumi-user-login }}
        token-expiration: 3600

    # No `command`: installs the CLI only. Same version as @pulumi/pulumi in
    # the catalog; bump them together.
    - uses: pulumi/actions@8e5e406f4007fca908480587cb9893c07090f58d # v7.0.0
      with:
        pulumi-version: 3.268.0

    # The stack's settings are committed (Pulumi.<stack>.yaml); its state
    # lives in Pulumi Cloud and is created on the first deploy.
    - name: Infra (pulumi up)
      shell: bash
      working-directory: infra/cloudflare
      env:
        STACK: ${{ inputs.environment }}
        CLOUDFLARE_API_TOKEN: ${{ inputs.cloudflare-infra-api-token }}
      run: |
        pulumi stack select --create "$STACK"
        pulumi up --stack "$STACK" --yes --diff

    - name: Read the stack's outputs
      id: stack
      shell: bash
      working-directory: infra/cloudflare
      env:
        STACK: ${{ inputs.environment }}
      run: |
        pulumi stack output --stack "$STACK" --json > "$RUNNER_TEMP/outputs.json"
        echo "url=$(jq -r .webBaseUrl "$RUNNER_TEMP/outputs.json")" >> "$GITHUB_OUTPUT"
        # Unset until the stack's web domain is attached (`webDeployed`).
        echo "domain=$(jq -r '.webDomainId // empty' "$RUNNER_TEMP/outputs.json")" >> "$GITHUB_OUTPUT"

    - name: Point the wrangler configs at the stack
      shell: bash
      run: pnpm sync-env --outputs "$RUNNER_TEMP/outputs.json"

    - name: Build
      shell: bash
      run: pnpm turbo run build --filter=@flareling/web --filter=@flareling/jobs --filter=@flareling/realtime

    # The bookmark to `wrangler d1 time-travel restore` to if a migration
    # goes wrong. Workers Free keeps 7 days of Time Travel history.
    - name: Record a D1 restore point
      shell: bash
      working-directory: apps/web
      env:
        STACK: ${{ inputs.environment }}
        CLOUDFLARE_ACCOUNT_ID: ${{ inputs.cloudflare-account-id }}
        CLOUDFLARE_API_TOKEN: ${{ inputs.cloudflare-api-token }}
        WRANGLER_SEND_METRICS: "false"
      run: |
        pnpm run --silent db:restore-point | tee "$RUNNER_TEMP/restore-point.json"
        {
          echo "### D1 restore point before migrating ($STACK)"
          echo '```json'
          cat "$RUNNER_TEMP/restore-point.json"
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Migrate D1
      shell: bash
      working-directory: apps/web
      env:
        CLOUDFLARE_ACCOUNT_ID: ${{ inputs.cloudflare-account-id }}
        CLOUDFLARE_API_TOKEN: ${{ inputs.cloudflare-api-token }}
        WRANGLER_SEND_METRICS: "false"
      run: pnpm run db:migrate:remote

    # Uploaded with each Worker version (`--secrets-file`), so code and
    # secrets change together. Additive: a secret left unset here keeps its
    # deployed value. Unset ones are omitted, which leaves that feature off
    # (billing). Turnstile's secret is the stack's widget, and Resend's key
    # comes from the stack's config (empty on a stack using the outbox); both
    # are masked as soon as they're read.
    - name: Write the secrets files
      shell: bash
      env:
        STACK: ${{ inputs.environment }}
        STRIPE_SECRET_KEY: ${{ inputs.stripe-secret-key }}
        STRIPE_WEBHOOK_SECRET: ${{ inputs.stripe-webhook-secret }}
      run: |
        umask 077
        TURNSTILE_SECRET_KEY="$(cd infra/cloudflare && pulumi stack output turnstileSecretKey --show-secrets --stack "$STACK")"
        echo "::add-mask::$TURNSTILE_SECRET_KEY"
        RESEND_API_KEY="$(cd infra/cloudflare && pulumi stack output resendApiKey --show-secrets --stack "$STACK")"
        if [ -n "$RESEND_API_KEY" ]; then echo "::add-mask::$RESEND_API_KEY"; fi
        export TURNSTILE_SECRET_KEY RESEND_API_KEY
        pick='with_entries(select(.value != null and .value != ""))'
        jq -n "env | {TURNSTILE_SECRET_KEY, RESEND_API_KEY, STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET} | $pick" \
          > "$RUNNER_TEMP/web-secrets.json"
        jq -n "env | {STRIPE_SECRET_KEY} | $pick" > "$RUNNER_TEMP/jobs-secrets.json"

    - name: Deploy apps/jobs
      shell: bash
      working-directory: apps/jobs
      env:
        CLOUDFLARE_ACCOUNT_ID: ${{ inputs.cloudflare-account-id }}
        CLOUDFLARE_API_TOKEN: ${{ inputs.cloudflare-api-token }}
        WRANGLER_SEND_METRICS: "false"
      run: pnpm run deploy --secrets-file "$RUNNER_TEMP/jobs-secrets.json"

    # Before web: web's Durable Object binding names this Worker's
    # WorkspaceRoom class, which has to exist. No secrets. Its `migrations`
    # create the class on the first deploy.
    - name: Deploy apps/realtime
      shell: bash
      working-directory: apps/realtime
      env:
        CLOUDFLARE_ACCOUNT_ID: ${{ inputs.cloudflare-account-id }}
        CLOUDFLARE_API_TOKEN: ${{ inputs.cloudflare-api-token }}
        WRANGLER_SEND_METRICS: "false"
      run: pnpm run deploy

    # Deploys the config the build wrote to dist/ (the Vite plugin points
    # Wrangler at it), which sync-env's changes are in. The Turnstile site
    # key is public: the sign-in page reads it from the server.
    - name: Deploy apps/web
      shell: bash
      working-directory: apps/web
      env:
        CLOUDFLARE_ACCOUNT_ID: ${{ inputs.cloudflare-account-id }}
        CLOUDFLARE_API_TOKEN: ${{ inputs.cloudflare-api-token }}
        WRANGLER_SEND_METRICS: "false"
      run: |
        site_key="$(jq -r .turnstileSiteKey "$RUNNER_TEMP/outputs.json")"
        pnpm run deploy --secrets-file "$RUNNER_TEMP/web-secrets.json" \
          --var "TURNSTILE_SITE_KEY:$site_key"

    - name: Remove the secrets files
      if: always()
      shell: bash
      run: rm -f "$RUNNER_TEMP/web-secrets.json" "$RUNNER_TEMP/jobs-secrets.json"

    # Playwright drives real Chromium, which passes the edge's bot checks; a
    # bare curl from a runner is challenged (found in ucmc.spencerwill.com).
    # Skipped until the stack's web domain is attached: before that the
    # Worker has no public URL.
    - name: Install Chromium
      if: steps.stack.outputs.domain != ''
      shell: bash
      run: pnpm --filter @flareling/web exec playwright install --with-deps chromium

    - name: Smoke test
      id: smoke
      if: steps.stack.outputs.domain != ''
      shell: bash
      working-directory: apps/web
      env:
        E2E_BASE_URL: ${{ steps.stack.outputs.url }}
      run: pnpm run test:e2e --project=desktop-chromium

    - name: Note the skipped smoke test
      if: steps.stack.outputs.domain == ''
      shell: bash
      env:
        STACK: ${{ inputs.environment }}
      run: |
        echo "::warning::No smoke test: the $STACK web domain isn't attached yet. Set webDeployed in infra/cloudflare's $STACK stack config."

    # Code only. D1 stays as migrated (restore it from the bookmark above if
    # the migration is the problem), which is why migrations must only add.
    - name: Roll back prod
      if: failure() && steps.smoke.outcome == 'failure' && inputs.environment == 'prod'
      shell: bash
      env:
        CLOUDFLARE_ACCOUNT_ID: ${{ inputs.cloudflare-account-id }}
        CLOUDFLARE_API_TOKEN: ${{ inputs.cloudflare-api-token }}
      run: |
        (cd apps/web && pnpm run rollback --message "Smoke test failed for $GITHUB_SHA")
        (cd apps/jobs && pnpm run rollback --message "Smoke test failed for $GITHUB_SHA")
        (cd apps/realtime && pnpm run rollback --message "Smoke test failed for $GITHUB_SHA")

    - name: Upload the Playwright report
      if: failure() && steps.smoke.outcome == 'failure'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: playwright-report-${{ inputs.environment }}
        path: apps/web/playwright-report/
        retention-days: 7
