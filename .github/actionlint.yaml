# actionlint's configuration: every suppressed error, with why.
# https://github.com/rhysd/actionlint/blob/main/docs/config.md
paths:
  .github/workflows/deploy.yml:
    ignore:
      # deploy.yml is a reusable workflow, and actionlint allows only
      # declared `workflow_call` secrets there. These are environment secrets,
      # read through the job's `environment:`. Declaring them to satisfy
      # actionlint makes them resolve to the caller's (empty) value instead.
      - 'property "(cloudflare_api_token|cloudflare_infra_api_token|stripe_secret_key|stripe_webhook_secret)" is not defined in object type'
