# Checks every change, then deploys main: dev on every push, prod once a
# reviewer approves that same run (the `prod` environment). Check jobs are
# `check: <what>` and deploy jobs `deploy: <environment>`; only `required`
# (which waits on every check) is a required status check, so renaming a check
# never breaks the ruleset. The deploy steps live in deploy.yml, called once
# per environment. Design: docs/adr/0021-one-pipeline-from-check-to-prod.md.
name: CI/CD

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  # Also on main itself: during setup, commits land on main directly, and
  # after that a push run confirms the merged result.
  push:
    branches: [main]

# Jobs opt in to the scopes they need.
permissions: {}

# One in-flight run per PR, so a fixup push cancels the superseded run. Runs on
# main are never cancelled, so every commit there gets a complete result (and
# a deploy is never cut off; deploy.yml also queues deploys per environment).
concurrency:
  group: cicd-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Decides once which kinds of files a PR touched. Downstream jobs gate on
  # these outputs, and a skipped job still satisfies a required check, so a
  # docs-only PR does not wait on a full verify. Push runs skip detection and
  # run everything: the filter would need git history (and credentials) to
  # compare a push, while PR runs read the changed files from the API.
  paths:
    name: "check: changes"
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
      pull-requests: read # paths-filter lists the PR's files via the API
    outputs:
      code: ${{ github.event_name == 'push' || steps.filter.outputs.code == 'true' }}
      workflows: ${{ github.event_name == 'push' || steps.filter.outputs.workflows == 'true' }}
    steps:
      - id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          # A file matches `code` only if it matches every pattern, so the
          # negations carve out files that cannot change a verify result.
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!LICENSE'
              - '!.devcontainer/**'
              - '!.zed/**'
            workflows:
              - '.github/workflows/**'
              - '.github/zizmor.yml'

  # Walks the whole lockfile, so it runs on every change rather than by path.
  # Production dependencies only: dev tooling never ships in a Worker bundle.
  audit:
    name: "check: audit"
    needs: paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Reads the pnpm version from `packageManager` in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm audit --audit-level high --prod

  # Secret scan over the full history, on every run: a credential committed and
  # then deleted is still in the history GitHub serves. The pre-commit hook runs
  # the same scan on staged changes; this is the backstop for commits made
  # without it. Installed like actionlint and zizmor below, from the pinned
  # release with a SHA-256 check (the version matches .devcontainer/Dockerfile).
  secrets:
    name: "check: secrets"
    needs: paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -fsSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check --strict
          tar xzf gitleaks.tar.gz gitleaks
          ./gitleaks version

      - name: gitleaks
        run: ./gitleaks git --redact --no-banner --verbose .

  # The same gate as `pnpm verify` locally (Biome, sherif, knip, typecheck,
  # tests in workerd and Chromium, boundaries), then a production build, the Worker size budget, and
  # Playwright against that build. One job rather than several so the install
  # and build are paid for once.
  verify:
    name: "check: verify"
    needs: paths
    if: needs.paths.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    # The inbox the E2E sign-in tests read magic links from, and the Stripe
    # API stand-in the billing tests use. Pinned to the same releases as the
    # dev container's (.devcontainer/docker-compose.yml); Dependabot doesn't
    # update service images here, so bump both together.
    services:
      mailpit:
        image: axllent/mailpit:v1.31.4@sha256:b68349e3a014b90c5610bfb26b2ae36f3892d7b8cf25ee140c6c71c98d2fcf48
        ports:
          - 8025:8025
      stripe-mock:
        image: stripe/stripe-mock:v0.206.0@sha256:aeb96b83e87a893d2ac005e363ac01ffa6e59a5ad85b49c155dfc9129de02e78
        ports:
          - 12111:12111
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Turborepo's local cache, carried between runs (the GitHub Actions
      # recipe in turbo's bundled docs), restored by prefix. Only runs on main
      # save it (at the end of the job): the key is unique per commit, and a
      # PR's caches can't be read by other PRs, so saving from PRs would only
      # fill the repo's 10 GB cache and evict the useful entries (see
      # docs/platform-limits.md).
      - name: Restore the turbo cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile

      # Installed before `pnpm verify`, which runs libs/ui's stories in
      # Chromium (Vitest browser mode), and used again by the E2E step. PRs run
      # E2E in desktop Chromium only, so they install only Chromium; runs on
      # main install WebKit too, for the mobile Safari project. The binaries
      # are cached by Playwright version (saved only from main, with both
      # browsers). A cache hit still installs the system packages, which can't
      # be cached.
      - name: Resolve Playwright version
        id: playwright
        run: echo "version=$(pnpm --filter @flareling/web exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Restore Playwright browsers
        id: playwright-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Playwright browsers (main)
        if: github.event_name == 'push'
        run: pnpm --filter @flareling/web exec playwright install --with-deps chromium webkit

      - name: Install Playwright browsers (PR)
        if: github.event_name != 'push'
        run: pnpm --filter @flareling/web exec playwright install --with-deps chromium

      - name: Save Playwright browsers
        if: github.event_name == 'push' && steps.playwright-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - run: pnpm verify

      - run: pnpm build

      # Fails when a Worker passes Workers' 64 MiB uncompressed limit, or its
      # gzip budget (a proxy for the 1 s startup limit). Sizes go to the run
      # summary.
      - run: pnpm size

      # The Workers under `vite preview` can't reach a service on loopback
      # (found in ucmc.spencerwill.com), but service ports are published on
      # every interface, so the runner's own address works for both the
      # Workers and the Playwright fixture. The services may still be
      # starting, too.
      - name: Point the E2E suite at Mailpit and stripe-mock
        run: |
          host="$(hostname -I | awk '{print $1}')"
          mailpit="http://$host:8025"
          stripe="http://$host:12111"
          ready() {
            curl -sf "$mailpit/api/v1/info" > /dev/null &&
              curl -sf -H "Authorization: Bearer sk_test_ci" "$stripe/v1/customers?limit=1" > /dev/null
          }
          for _ in $(seq 1 30); do
            ready && break
            sleep 1
          done
          ready
          echo "MAILPIT_URL=$mailpit" >> "$GITHUB_ENV"
          echo "STRIPE_API_BASE=$stripe" >> "$GITHUB_ENV"

      # Against `vite preview`, which serves the production build through
      # workerd. The build step above is a turbo cache hit here. PRs run the
      # desktop Chromium project only, to save Actions minutes; main runs
      # every browser project.
      - name: E2E (main, every browser)
        if: github.event_name == 'push'
        run: pnpm test:e2e

      - name: E2E (PR, desktop Chromium)
        if: github.event_name != 'push'
        run: pnpm test:e2e -- --project=desktop-chromium

      - name: Save the turbo cache
        if: github.event_name == 'push'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  # Static analysis for the workflows themselves, which nothing else checks.
  # actionlint covers the schema, expression types and (through shellcheck,
  # preinstalled on ubuntu-latest) every `run:` body. zizmor covers security
  # shapes: template injection, credential persistence, dangerous triggers.
  #
  # Both come from pinned release tarballs verified against SHA-256, not from
  # `curl | sh` or a wrapper action.
  workflow-lint:
    name: "check: workflows"
    needs: paths
    if: needs.paths.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
      ZIZMOR_VERSION: 1.30.1
      ZIZMOR_SHA256: e65324f4430c2717591937edcec90ccbefaf14c174f8ec9415e03ca875b46e1a
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install actionlint
        run: |
          curl -fsSL -o actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum --check --strict
          tar xzf actionlint.tar.gz actionlint
          ./actionlint --version

      - name: Install zizmor
        run: |
          curl -fsSL -o zizmor.tar.gz \
            "https://github.com/zizmorcore/zizmor/releases/download/v${ZIZMOR_VERSION}/zizmor-x86_64-unknown-linux-gnu.tar.gz"
          echo "${ZIZMOR_SHA256}  zizmor.tar.gz" | sha256sum --check --strict
          tar xzf zizmor.tar.gz zizmor
          ./zizmor --version

      - name: actionlint
        run: ./actionlint -color

      # Any future ignore goes in .github/zizmor.yml with its reason.
      - name: zizmor
        run: ./zizmor --color always .github/workflows/

  # The one required status check (infra/github's ruleset). It passes when
  # every check passed or was skipped as irrelevant (a docs-only PR skips
  # verify), and fails if any failed or was cancelled. A job skipped by `if:`
  # reports success to a ruleset, but a check that never ran at all would
  # leave the PR waiting, hence one aggregate rather than a list of names.
  required:
    name: required
    needs: [paths, audit, secrets, verify, workflow-lint]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Every check passed or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          case " $RESULTS " in
            *" failure "* | *" cancelled "*) exit 1 ;;
          esac

  # Deploys are off until the repo variable DEPLOYS_ENABLED is "true"
  # (infra/github sets it). Until then main only runs the checks.
  deploy-dev:
    name: "deploy: dev"
    needs: required
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      vars.DEPLOYS_ENABLED == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/deploy.yml
    with:
      environment: dev
    # Environment secrets reach deploy.yml's job through its `environment:`;
    # only repo-level secrets are passed, by name, never `inherit`.
    secrets:
      PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}

  # The same commit, once dev deployed and passed its smoke test. Waits for a
  # reviewer on the `prod` environment; a waiting run uses no runner time.
  # deploy.yml's per-environment concurrency group should let a newer run's
  # prod deploy replace an older one still waiting (verify on the first runs).
  #
  # Runs only when PROD_APPROVAL_REQUIRED is "true", which infra/github sets
  # only if `prod` really has a required reviewer. Without one (a private repo
  # on GitHub Free) nothing would stop every push to main reaching prod.
  deploy-prod:
    name: "deploy: prod"
    needs: deploy-dev
    if: vars.PROD_APPROVAL_REQUIRED == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/deploy.yml
    with:
      environment: prod
    secrets:
      PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
