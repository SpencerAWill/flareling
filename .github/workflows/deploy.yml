# Deploys one environment (a Pulumi stack, a GitHub environment, and its two
# Workers) at the calling run's commit. Called by cicd.yml: `deploy: dev` on
# every push to main, then `deploy: prod` once a reviewer approves the run.
#
# One job, not one per stage: each job that names a protected environment
# asks for its own approval, so a prod deploy split into infra / workers /
# smoke would need three. Steps run in the order the README's "Environments
# and deployment" section explains:
#
#   1. pulumi up            long-lived resources (D1, Queues, the domain)
#   2. sync-env             point the wrangler configs at this stack
#   3. build                with this stack's config
#   4. D1 restore point     the way back, since migrations have no "down"
#   5. migrate              before any code that needs the new schema
#   6. deploy jobs, then web    consumers before producers
#   7. smoke                the @smoke Playwright specs against the site
#   8. rollback (prod)      the Workers' code, if smoke failed; never D1
name: Deploy

on:
  workflow_call:
    inputs:
      environment:
        description: dev or prod (the GitHub environment and the Pulumi stack)
        type: string
        required: true
    secrets:
      # Repo-level, set by hand once (README, "GitHub as code"); the caller
      # passes it.
      PULUMI_ACCESS_TOKEN:
        required: true
      # The rest are the environment's own secrets, which this job reads
      # through its `environment:` (an environment secret wins over a passed
      # one). Declared so the workflow's inputs are listed in one place. The
      # Cloudflare tokens are written by infra/github; the Stripe secrets are
      # set by hand per environment, and unset ones leave billing off.
      # Turnstile's keys come from the Pulumi stack, not from here.
      CLOUDFLARE_API_TOKEN:
        required: false
      CLOUDFLARE_INFRA_API_TOKEN:
        required: false
      STRIPE_SECRET_KEY:
        required: false
      STRIPE_WEBHOOK_SECRET:
        required: false

permissions: {}

jobs:
  deploy:
    name: infra, migrate, deploy, smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    environment:
      name: ${{ inputs.environment }}
      url: ${{ steps.stack.outputs.url }}
    # One deploy per environment at a time, never cancelled halfway. A newer
    # run waits behind it.
    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false
    env:
      STACK: ${{ inputs.environment }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # No `command`: installs the CLI only. Same version as @pulumi/pulumi in
      # the catalog; bump them together.
      - uses: pulumi/actions@8e5e406f4007fca908480587cb9893c07090f58d # v7.0.0
        with:
          pulumi-version: 3.268.0

      - name: Infra (pulumi up)
        working-directory: infra/cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_INFRA_API_TOKEN }}
        # The stack's settings are committed (Pulumi.<stack>.yaml); its state
        # lives in Pulumi Cloud and is created on the first deploy.
        run: |
          pulumi stack select --create "$STACK"
          pulumi up --stack "$STACK" --yes --diff

      - name: Read the stack's outputs
        id: stack
        working-directory: infra/cloudflare
        run: |
          pulumi stack output --stack "$STACK" --json > "$RUNNER_TEMP/outputs.json"
          echo "url=$(jq -r .webBaseUrl "$RUNNER_TEMP/outputs.json")" >> "$GITHUB_OUTPUT"
          # Unset until the stack's web domain is attached (`webDeployed`).
          echo "domain=$(jq -r '.webDomainId // empty' "$RUNNER_TEMP/outputs.json")" >> "$GITHUB_OUTPUT"

      - name: Point the wrangler configs at the stack
        run: pnpm sync-env --outputs "$RUNNER_TEMP/outputs.json"

      - name: Build
        run: pnpm turbo run build --filter=@flareling/web --filter=@flareling/jobs

      # The bookmark to `wrangler d1 time-travel restore` to if a migration
      # goes wrong. Workers Free keeps 7 days of Time Travel history.
      - name: Record a D1 restore point
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          pnpm run --silent db:restore-point | tee "$RUNNER_TEMP/restore-point.json"
          {
            echo "### D1 restore point before migrating ($STACK)"
            echo '```json'
            cat "$RUNNER_TEMP/restore-point.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Migrate D1
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm run db:migrate:remote

      # Uploaded with each Worker version (`--secrets-file`), so code and
      # secrets change together. Additive: a secret left unset here keeps
      # its deployed value. Unset ones are omitted, which leaves that feature
      # off (billing). Turnstile's secret is the stack's widget (masked as
      # soon as it's read).
      - name: Write the secrets files
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
        run: |
          umask 077
          TURNSTILE_SECRET_KEY="$(cd infra/cloudflare && pulumi stack output turnstileSecretKey --show-secrets --stack "$STACK")"
          echo "::add-mask::$TURNSTILE_SECRET_KEY"
          export TURNSTILE_SECRET_KEY
          pick='with_entries(select(.value != null and .value != ""))'
          jq -n "env | {TURNSTILE_SECRET_KEY, STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET} | $pick" \
            > "$RUNNER_TEMP/web-secrets.json"
          jq -n "env | {STRIPE_SECRET_KEY} | $pick" > "$RUNNER_TEMP/jobs-secrets.json"

      - name: Deploy apps/jobs
        working-directory: apps/jobs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm run deploy --secrets-file "$RUNNER_TEMP/jobs-secrets.json"

      # Deploys the config the build wrote to dist/ (the Vite plugin points
      # Wrangler at it), which sync-env's changes are in.
      - name: Deploy apps/web
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        # The site key is public: the sign-in page reads it from the server.
        run: |
          site_key="$(jq -r .turnstileSiteKey "$RUNNER_TEMP/outputs.json")"
          pnpm run deploy --secrets-file "$RUNNER_TEMP/web-secrets.json" \
            --var "TURNSTILE_SITE_KEY:$site_key"

      - name: Remove the secrets files
        if: always()
        run: rm -f "$RUNNER_TEMP/web-secrets.json" "$RUNNER_TEMP/jobs-secrets.json"

      # Playwright drives real Chromium, which passes the edge's bot checks;
      # a bare curl from a runner is challenged (found in ucmc.spencerwill.com).
      # Skipped until the stack's web domain is attached: before that the
      # Worker has no public URL.
      - name: Install Chromium
        if: steps.stack.outputs.domain != ''
        run: pnpm --filter @flareling/web exec playwright install --with-deps chromium

      - name: Smoke test
        id: smoke
        if: steps.stack.outputs.domain != ''
        working-directory: apps/web
        env:
          E2E_BASE_URL: ${{ steps.stack.outputs.url }}
        run: pnpm run test:e2e --project=desktop-chromium

      - name: Note the skipped smoke test
        if: steps.stack.outputs.domain == ''
        run: |
          echo "::warning::No smoke test: the $STACK web domain isn't attached yet. Set webDeployed in infra/cloudflare's $STACK stack config."

      # Code only. D1 stays as migrated (restore it from the bookmark above if
      # the migration is the problem), which is why migrations must only add.
      - name: Roll back prod
        if: failure() && steps.smoke.outcome == 'failure' && inputs.environment == 'prod'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          (cd apps/web && pnpm run rollback --message "Smoke test failed for $GITHUB_SHA")
          (cd apps/jobs && pnpm run rollback --message "Smoke test failed for $GITHUB_SHA")

      - name: Upload the Playwright report
        if: failure() && steps.smoke.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ inputs.environment }}
          path: apps/web/playwright-report/
          retention-days: 7
