name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  # Also on main itself: during setup, commits land on main directly, and
  # after that a push run confirms the merged result.
  push:
    branches: [main]

# Jobs opt in to the scopes they need.
permissions: {}

# One in-flight run per PR, so a fixup push cancels the superseded run. Runs on
# main are never cancelled, so every commit there gets a complete result.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Decides once which kinds of files a PR touched. Downstream jobs gate on
  # these outputs, and a skipped job still satisfies a required check, so a
  # docs-only PR does not wait on a full verify. Push runs skip detection and
  # run everything: the filter would need git history (and credentials) to
  # compare a push, while PR runs read the changed files from the API.
  paths:
    name: Detect changed paths
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
      pull-requests: read # paths-filter lists the PR's files via the API
    outputs:
      code: ${{ github.event_name == 'push' || steps.filter.outputs.code == 'true' }}
      workflows: ${{ github.event_name == 'push' || steps.filter.outputs.workflows == 'true' }}
    steps:
      - id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          # A file matches `code` only if it matches every pattern, so the
          # negations carve out files that cannot change a verify result.
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!LICENSE'
              - '!.devcontainer/**'
              - '!.zed/**'
            workflows:
              - '.github/workflows/**'
              - '.github/zizmor.yml'

  # Walks the whole lockfile, so it runs on every change rather than by path.
  # Production dependencies only: dev tooling never ships in a Worker bundle.
  audit:
    name: Audit
    needs: paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Reads the pnpm version from `packageManager` in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm audit --audit-level high --prod

  # Secret scan over the full history, on every run: a credential committed and
  # then deleted is still in the history GitHub serves. The pre-commit hook runs
  # the same scan on staged changes; this is the backstop for commits made
  # without it. Installed like actionlint and zizmor below, from the pinned
  # release with a SHA-256 check (the version matches .devcontainer/Dockerfile).
  secrets:
    name: Secret scan (gitleaks)
    needs: paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -fsSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check --strict
          tar xzf gitleaks.tar.gz gitleaks
          ./gitleaks version

      - name: gitleaks
        run: ./gitleaks git --redact --no-banner --verbose .

  # The same gate as `pnpm verify` locally (Biome, sherif, knip, typecheck,
  # tests in workerd, boundaries), then a production build, the Worker size budget, and
  # Playwright against that build. One job rather than several so the install
  # and build are paid for once.
  verify:
    name: Verify, build, E2E
    needs: paths
    if: needs.paths.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Turborepo's local cache, carried between runs (the GitHub Actions
      # recipe in turbo's bundled docs). The key is unique per commit, so each
      # run saves a fresh entry and restores the newest one by prefix.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile

      - run: pnpm verify

      - run: pnpm build

      # Fails when a Worker's gzip upload passes its budget (below the Workers
      # Free plan's 3 MB cap). Sizes go to the run summary.
      - run: pnpm size

      # Browser binaries are cached by Playwright version rather than by the
      # lockfile, which changes on every dependency bump. A cache hit still has
      # to install the system packages, which cannot be cached.
      - name: Resolve Playwright version
        id: playwright
        run: echo "version=$(pnpm --filter @flareling/web exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @flareling/web exec playwright install --with-deps chromium webkit

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @flareling/web exec playwright install-deps chromium webkit

      # Against `vite preview`, which serves the production build through
      # workerd. The build step above is a turbo cache hit here.
      - run: pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  # Static analysis for the workflows themselves, which nothing else checks.
  # actionlint covers the schema, expression types and (through shellcheck,
  # preinstalled on ubuntu-latest) every `run:` body. zizmor covers security
  # shapes: template injection, credential persistence, dangerous triggers.
  #
  # Both come from pinned release tarballs verified against SHA-256, not from
  # `curl | sh` or a wrapper action.
  workflow-lint:
    name: Workflows (actionlint, zizmor)
    needs: paths
    if: needs.paths.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
      ZIZMOR_VERSION: 1.30.1
      ZIZMOR_SHA256: e65324f4430c2717591937edcec90ccbefaf14c174f8ec9415e03ca875b46e1a
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install actionlint
        run: |
          curl -fsSL -o actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum --check --strict
          tar xzf actionlint.tar.gz actionlint
          ./actionlint --version

      - name: Install zizmor
        run: |
          curl -fsSL -o zizmor.tar.gz \
            "https://github.com/zizmorcore/zizmor/releases/download/v${ZIZMOR_VERSION}/zizmor-x86_64-unknown-linux-gnu.tar.gz"
          echo "${ZIZMOR_SHA256}  zizmor.tar.gz" | sha256sum --check --strict
          tar xzf zizmor.tar.gz zizmor
          ./zizmor --version

      - name: actionlint
        run: ./actionlint -color

      # Any future ignore goes in .github/zizmor.yml with its reason.
      - name: zizmor
        run: ./zizmor --color always .github/workflows/
