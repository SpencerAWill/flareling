packages:
  # Deployables: each is a Worker with its own wrangler.jsonc.
  - apps/*
  # Source-only internal packages, bundled into the apps that import them.
  - libs/*
  # Dev-time config presets and scripts. Never bundled.
  - tooling/*
  # Pulumi programs (infra/cloudflare, infra/github) are workspace packages so
  # they share the root lockfile and toolchain. Pulumi's nodejs runtime resolves
  # `@pulumi/*` from the node_modules that pnpm links into each project.
  - infra/*

# Keep pnpm's content-addressable store inside node_modules, so the store and
# the packages it hardlinks into share one filesystem. In the dev container
# node_modules is a named volume, and on Docker Desktop every volume and bind
# mount is a separate filesystem (hardlinks across them fail with EXDEV). Left
# alone, pnpm finds a spot on its own only when run from the repo root; from a
# package directory it creates a second, full store at /workspace/.pnpm-store
# on the slow bind mount. Relative on purpose: it resolves against the
# workspace root from any directory, in the container, on the host, and in CI.
# Same setting as www.spencerwill.com and ucmc.spencerwill.com.
storeDir: node_modules/.store

# Quarantine window for newly published versions: refuses to install anything
# released in the last 7 days. This is the primary supply-chain defense, and it
# catches publish-compromise incidents before they reach the tree. A
# just-released version is refused until it ages out. The escape hatch is
# `minimumReleaseAgeExclude`.
#
# The same rule applies by hand to the `packageManager` pin in package.json,
# which this setting does not cover.
minimumReleaseAge: 10080

# Fails install when a package's new version has weaker publish provenance
# than an earlier one (e.g. a release that lost trusted publishing, the
# signature of a hijacked maintainer token). Complements the quarantine above,
# which catches compromises by age; this catches them by how they were
# published.
trustPolicy: no-downgrade
# Exact versions only, each with its reason, so a new downgrade still fails.
trustPolicyExclude:
  # A 6.x maintenance release published in July 2023 without provenance, after
  # 7.5.4 had it. pnpm judges trust by publish date, so the older line reads as
  # a downgrade. Pulled in through @babel/core by TanStack's router plugin.
  - semver@6.3.1

# pnpm 12 hard-fails on unrecognized keys in this file (the repo pins its pnpm
# version), so a typo here breaks install instead of being silently ignored.

# Install scripts are opt-in, and pnpm only reads the allowlist from the
# workspace root. Each entry says who needs it and why.
allowBuilds:
  # Vite and Wrangler bundle with esbuild. Its postinstall selects the
  # prebuilt binary for the current platform.
  esbuild: true
  # workerd is the Workers runtime itself: @cloudflare/vite-plugin runs server
  # code inside it during `pnpm dev`, and Wrangler runs it for local preview.
  # Blocked, the package installs "successfully" and every invocation then
  # fails on a missing binary.
  workerd: true
  # Pulled in by @pulumi/pulumi. Its postinstall generates the static protobuf
  # accessors used for gRPC to the Pulumi engine.
  protobufjs: true

# Every external dependency's version lives here, and packages reference it
# with `"catalog:"`, so each dependency has one version across the workspace
# and one edit upgrades every app and lib together. `catalogMode: strict` makes
# `pnpm add` write new dependencies here too, and refuse a version outside the
# catalog's range instead of adding a second one.
catalogMode: strict
catalog:
  # Language and types
  typescript: ^7.0.2
  "@types/node": ^26.6.1
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0

  # App framework
  "@tanstack/react-router": ^1.170.41
  "@tanstack/react-start": ^1.168.60
  react: ^19.3.0
  react-dom: ^19.3.0
  vite: ^8.3.2
  "@vitejs/plugin-react": ^6.1.2
  tailwindcss: ^4.3.3
  "@tailwindcss/vite": ^4.3.3
  clsx: ^2.1.1
  tailwind-merge: ^3.7.0

  # Data, validation and ids
  drizzle-orm: ^0.45.4
  drizzle-kit: ^0.31.11
  zod: ^4.6.5
  "@t3-oss/env-core": ^0.13.11
  uuidv7: ^1.2.1
  temporal-polyfill: ^1.0.5

  # Auth and billing
  "@simplewebauthn/server": ^14.0.3
  "@simplewebauthn/browser": ^14.0.0
  # The SDK pins the Stripe API version, so upgrading it is an API upgrade:
  # read Stripe's changelog for the versions in between.
  stripe: ^23.0.0

  # Cloudflare
  # Kept on the wrangler version @cloudflare/vitest-plugin and vite-plugin pin,
  # so the workspace has one wrangler.
  "@cloudflare/vite-plugin": ^1.63.1
  wrangler: ^4.149.0

  # Testing
  # Vitest and @cloudflare/vitest-plugin move together: the plugin peers on a
  # Vitest range (1.4.0 added Vitest 5). Dependabot groups them.
  vitest: ^5.0.3
  "@cloudflare/vitest-plugin": ^1.4.0
  # The @vitest/* companions peer on the exact Vitest version, so they move
  # with `vitest` above (Dependabot groups them).
  "@vitest/coverage-istanbul": ^5.0.3
  "@vitest/browser-playwright": ^5.0.3
  fast-check: ^4.10.2
  # `playwright` is the browser driver Vitest's browser mode uses; keep it on
  # the same version as @playwright/test.
  "@playwright/test": ^1.63.0
  playwright: ^1.63.0
  "@axe-core/playwright": ^4.13.0
  # Outbound HTTP mocking in Workers tests (fetchMock was removed from the
  # Cloudflare test plugin; its docs point here).
  msw: ^3.0.2
  "@msw/cloudflare": ^0.2.0
  storybook: ^10.6.1
  "@storybook/react-vite": ^10.6.1
  "@storybook/addon-vitest": ^10.6.1
  "@storybook/addon-a11y": ^10.6.1
  "@stryker-mutator/api": ^10.0.0
  "@stryker-mutator/core": ^10.0.0
  "@stryker-mutator/vitest-runner": ^10.0.0

  # Infrastructure
  "@pulumi/pulumi": ^3.267.0
  "@pulumi/cloudflare": ^6.21.0
  "@pulumi/github": ^6.15.0

  # Repo tooling
  "@biomejs/biome": ^2.5.15
  "@commitlint/cli": ^21.2.3
  "@commitlint/config-conventional": ^21.2.3
  "@commitlint/cz-commitlint": ^21.2.3
  commitizen: ^4.3.2
  husky: ^9.1.7
  inquirer: ^12.11.1
  lint-staged: ^17.6.0
  sherif: ^1.13.0
  turbo: ^2.11.7
  knip: ^6.39.0

# Named catalogs: deliberate, temporary exceptions to one-version-per-dependency.
catalogs:
  # Stryker's test project (vitest.mutation.config.ts, run from the root) stays
  # on Vitest 4. @stryker-mutator/vitest-runner 10.0.0 filters tests by name,
  # and Vitest 5 joins nested names with " > ", so nothing inside a describe
  # block matches and every mutant those tests cover survives
  # (stryker-mutator/stryker-js#6210, fixes pending in #6214/#6220/#6247).
  # Remove this catalog, and the root's `vitest: catalog:mutation`, once a
  # runner release fixes it: then `pnpm test:mutation` kills every mutant on
  # Vitest 5 as well.
  mutation:
    vitest: ^4.1.11

# Security overrides for transitive dependencies, each pinned above the
# vulnerable range and capped at the major its consumers expect. Every target
# has cleared the release-age window, so none needs a quarantine exception.
# All four advisories are in dev and test tooling; none reaches a deployed
# Worker, and `pnpm audit --prod` (the CI gate) does not see them.
#   - esbuild <0.28.1  GHSA-67mh-4wv8-2f99 (dev server answers any origin) and
#               GHSA-g7r4-m6w7-qqqr (dev-server file read). drizzle-kit's
#               @esbuild-kit loader pulls 0.18.x; Vite is already on 0.28.
#   - qs <6.16.0  GHSA-q8mj-m7cp-5q26, GHSA-x5fp-wj9c-mxmx, GHSA-4mjr-xmp4-gh2g
#               (DoS); via @stryker-mutator/core's typed-rest-client.
#   - sharp <0.35.5  GHSA-wq5f-xc86-pv6w (bundled librsvg); via miniflare.
# Deliberately not overridden, because no fixed version exists:
#   - braces <=3.0.3  GHSA-vfj7-8cjw-p6xm (stack exhaustion on deeply nested
#               patterns). 3.0.3 is the latest release. Reached only through
#               commitizen's file lookup, over patterns in this repo.
overrides:
  "esbuild@<0.28.1": ">=0.28.1 <0.29.0"
  "qs@<6.16.0": ">=6.16.0 <7.0.0"
  "sharp@<0.35.5": ">=0.35.5 <0.36.0"

peerDependencyRules:
  allowedVersions:
    # @pulumi/pulumi wants TypeScript < 7 only for its ts-node runner. Both
    # Pulumi projects set `typescript: false` and run on Node's native type
    # stripping, so the TypeScript 7 in the catalog is never loaded by Pulumi.
    "@pulumi/pulumi>typescript": "7"
    # @vitest/mocker's optional msw peer (^2) is for module mocking in Vitest
    # browser mode. Our MSW 3 is used only in Workers-pool tests (libs/email
    # and others, through @msw/cloudflare), never in browser mode.
    "@vitest/mocker>msw": "3"
