config:
  # Same account and zone as www.spencerwill.com and ucmc.spencerwill.com.
  # The zone is shared, so this program manages only its own hostnames and
  # never zone-wide settings (see src/config.ts).
  flareling-cloudflare:accountId: d57880630b3277f59331318b53f323b6
  flareling-cloudflare:zoneId: 6bfb4d1d3134e6d765aef413094cd28f
  flareling-cloudflare:zoneName: spencerwill.com
  flareling-cloudflare:hostname: flareling.spencerwill.com
  flareling-cloudflare:resourcePrefix: flareling-prod
  flareling-cloudflare:protectData: "true"
  # AUTH_RATE_LIMITER's namespace; unique per stack (see src/config.ts).
  flareling-cloudflare:authRateLimitNamespaceId: "2001"
  flareling-cloudflare:realtimeRateLimitNamespaceId: "2002"
  # Resend's key and from-address come from the shared spencerwill.com stack,
  # which owns the verified spencerwill.com domain and issues each app its
  # own sending key (SpencerAWill/spencerwill.com#2). Apply that stack first.
  flareling-cloudflare:emailStack:
    stack: SpencerAWill/spencerwill-shared/prod
    apiKeyOutput: flarelingResendApiKey
    fromOutput: flarelingFromEmail
  # flareling-prod-web exists (first deployed 2026-10-19), so the hostname can
  # be attached to it (src/apps.ts).
  flareling-cloudflare:webDeployed: "true"
