config:
  # Same account and zone as www.spencerwill.com and ucmc.spencerwill.com.
  # The zone is shared, so this program manages only its own hostnames and
  # never zone-wide settings (see src/config.ts).
  flareling-cloudflare:accountId: d57880630b3277f59331318b53f323b6
  flareling-cloudflare:zoneId: 6bfb4d1d3134e6d765aef413094cd28f
  flareling-cloudflare:zoneName: spencerwill.com
  flareling-cloudflare:hostname: dev.flareling.spencerwill.com
  flareling-cloudflare:resourcePrefix: flareling-dev
  flareling-cloudflare:protectData: "false"
  # AUTH_RATE_LIMITER's namespace; unique per stack (see src/config.ts).
  flareling-cloudflare:authRateLimitNamespaceId: "1001"
  # REALTIME_RATE_LIMITER's; unique per stack too.
  flareling-cloudflare:realtimeRateLimitNamespaceId: "1002"
  # Email goes to the outbox at /dev/outbox, behind Cloudflare Access, until a
  # provider is chosen (docs/adr/0022-dev-email-outbox.md). Never in prod.
  flareling-cloudflare:emailOutbox: "true"
  flareling-cloudflare:outboxViewers: '["spencer.a.will@gmail.com"]'
  flareling-cloudflare:accessTeamDomain: late-hat-fec1.cloudflareaccess.com
  # flareling-dev-web exists (first deployed 2026-10-17), so the hostname can
  # be attached to it (src/apps.ts).
  flareling-cloudflare:webDeployed: "true"
